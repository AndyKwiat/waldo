<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Where's Waldo? — Living Pixel City of the East</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#557a4a;font-family:Georgia,'Times New Roman',serif}
  canvas{display:block;image-rendering:pixelated}
  #hud{position:fixed;top:12px;left:12px;background:#efe3c0;border:3px solid #2b2420;outline:2px solid #b83a2a;
       padding:10px 14px;box-shadow:4px 4px 0 #2b2420;max-width:270px;user-select:none}
  #hud h1{margin:0 0 4px;font-size:22px;color:#b83a2a;letter-spacing:1px}
  #hud p{margin:4px 0;font-size:13px;color:#2b2420;line-height:1.35}
  #hud ul{margin:6px 0 0;padding:0;list-style:none}
  #hud li{font-size:14px;margin:2px 0}
  #hud li.found{color:#3f6b4a;font-weight:bold;text-decoration:line-through}
  #hud li .sw{display:inline-block;width:12px;height:12px;border:1px solid #2b2420;vertical-align:middle;margin-right:6px}
  #msg{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:56px;color:#efe3c0;
       text-shadow:4px 4px 0 #2b2420,-2px -2px 0 #2b2420,2px -2px 0 #2b2420,-2px 2px 0 #2b2420;pointer-events:none;
       font-weight:bold;opacity:0;transition:opacity .3s}
  #stats{position:fixed;bottom:10px;right:12px;color:#fff;font:12px monospace;text-shadow:1px 1px 0 #000;pointer-events:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#557a4a;color:#efe3c0;font-size:28px;text-shadow:2px 2px 0 #2b2420}
</style>
</head>
<body>
<div id="loading">Painting the city…</div>
<div id="hud">
  <h1>WHERE'S WALDO?</h1>
  <p>A walled city in the mountains. Scroll to zoom, drag to pan, click a character to identify them.</p>
  <ul id="list"></ul>
  <p id="hint" style="color:#6b5a48;font-size:12px"></p>
</div>
<div id="msg"></div>
<div id="stats"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ------------------------------------------------------------------ RNG
let seed = 20260921;
const qs = new URLSearchParams(location.search);
if (qs.get('seed')) seed = +qs.get('seed');
function rand(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rnd = (a,b)=>a+rand()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));
const pick = a=>a[Math.floor(rand()*a.length)];
const chance = p=>rand()<p;
const PI = Math.PI, TAU = Math.PI*2;

// ------------------------------------------------------------------ WORLD LAYOUT
const W = 2600, H = 2040;      // world units (y up); top 380 units are the mountain vista
const S = 1;                   // 1 texel per world unit -> pixel art
const GS = 0.5;                // ground texels per unit (chunkier)
const STREET = 100, BW = 270, BH = 255, COLS = 6, ROWS = 4, X0 = 140, Y0 = 140;
const YT = Y0 + ROWS*(BH+STREET) + STREET;   // inner top edge of the city (1660)
const SX = [], SY = [];
for (let c=0;c<=COLS;c++) SX.push(X0 + c*(BW+STREET) + STREET/2);
for (let r=0;r<=ROWS;r++) SY.push(Y0 + r*(BH+STREET) + STREET/2);
const block = (c,r)=>({x:X0+STREET+c*(BW+STREET), y:Y0+STREET+r*(BH+STREET), w:BW, h:BH});
const PLAZA  = {...block(2,1), w:BW*2+STREET};
const FORT   = {...block(2,3), w:BW*2+STREET};
const CENTER = {x:PLAZA.x+PLAZA.w/2, y:PLAZA.y+PLAZA.h/2};
const INNER = {x0:X0-30, y0:Y0-30, x1:W-X0+30, y1:YT+30};
const FIELD_TOP = YT+150;      // above this: hills and mountains
const zOf = y => 1 + (H - y) / H * 50;
const inRect = (x,y,r)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;

// ------------------------------------------------------------------ PALETTES (muted, east-asian pixel look)
const OUT = '#2b2420';
const SKINS = ['#f2d6b0','#e8c49a','#d9ad82','#c9966a','#a8724c','#8a5a3a'];
const HAIRS = ['#1e1a18','#2b2420','#3a2e28','#4a3a30','#8a8a80','#e8dcb8'];
const CLOTH = ['#b83a2a','#2f4a7a','#3f6b4a','#d9a63a','#5a3a5a','#c56a2a','#7a5230','#3a7a78','#c98a9a','#e8dcb8',
               '#7a7a72','#2a2a2a','#8c2f3a','#4a6fa0','#6b8f5a','#e0b050','#4b3b6b','#a34a5a','#5f9a8a','#8a5a3a',
               '#c9a06a','#9fb8c4','#d9a0a0','#efe3c0','#6f8fa8','#b8683a'];
const ROOFS = ['#4a6068','#3d5a5e','#5a6a70','#b8683a','#a55a34','#4f7a5a','#6b5a4a','#8c3b2c'];
const WALLS = ['#e8dcb8','#efe3c0','#dccfae','#e3d2a8','#d8c8a0','#cfc2a0'];
const COLUMN = ['#9c3f2c','#8c2f3a','#b83a2a','#7a3a2a'];
const GREENS = ['#3f6b4a','#4f7a52','#5f8f5f','#6b8f5a','#3a5f44','#7fa06a'];
const BRICK = '#a39a86', BRICK_D = '#7d7466', BRICK_L = '#b8b0a0', STONE='#8e8a80', STONE_L='#b3b0a4';

// ------------------------------------------------------------------ PIXEL QUANTIZATION
let PAL=null, LUT=null, PALR, PALG, PALB;
function buildPalette(){
  const src=document.querySelector('script[type="module"]').textContent;
  const set=new Set((src.match(/#[0-9a-f]{6}\b/gi)||[]).map(s=>s.toLowerCase()));
  for (const c of [...ROOFS,...GREENS,...CLOTH]) set.add(darken(c,0.72)); for (const c of GREENS) set.add(darken(c,0.8)); for (const c of WALLS) set.add(darken(c,0.85));
  PAL=[...set].map(hex2rgb); PALR=PAL.map(c=>c[0]); PALG=PAL.map(c=>c[1]); PALB=PAL.map(c=>c[2]); LUT=new Int16Array(32768).fill(-1);
}
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function pixelate(canvas){
  const ctx=canvas.getContext('2d'); const img=ctx.getImageData(0,0,canvas.width,canvas.height); const d=img.data;
  for (let i=0;i<d.length;i+=4){
    if (d[i+3]<110){ d[i]=d[i+1]=d[i+2]=d[i+3]=0; continue; }
    d[i+3]=255; const r=d[i],g=d[i+1],b=d[i+2]; const key=((r>>3)<<10)|((g>>3)<<5)|(b>>3); let k=LUT[key];
    if (k<0){ let best=1e9; for (let j=0;j<PAL.length;j++){ const dr=PALR[j]-r,dg=PALG[j]-g,db=PALB[j]-b; const dist=dr*dr*2+dg*dg*3+db*db; if (dist<best){best=dist;k=j;} } LUT[key]=k; }
    d[i]=PALR[k]; d[i+1]=PALG[k]; d[i+2]=PALB[k];
  }
  ctx.putImageData(img,0,0);
}

// ------------------------------------------------------------------ ATLAS + LAYERS
class Atlas {
  constructor(size){ this.size=size; this.pages=[]; this.pad=2; this.newPage(); }
  newPage(){ const c=document.createElement('canvas'); c.width=c.height=this.size; const ctx=c.getContext('2d'); this.pages.push({canvas:c,ctx,x:0,y:0,shelf:0}); }
  alloc(w,h){
    let p=this.pages[this.pages.length-1];
    if (p.x+w>this.size){ p.y+=p.shelf; p.x=0; p.shelf=0; }
    if (p.y+h>this.size){ this.newPage(); p=this.pages[this.pages.length-1]; }
    const r={page:this.pages.length-1,x:p.x,y:p.y}; p.x+=w; p.shelf=Math.max(p.shelf,h); return r;
  }
  addUnit(uw,uh,draw){
    const cw=Math.ceil(uw*S), ch=Math.ceil(uh*S)+2, P=this.pad;
    const r=this.alloc(cw+2*P, ch+2*P); const ctx=this.pages[r.page].ctx;
    ctx.save(); ctx.translate(r.x+P, r.y+P); ctx.beginPath(); ctx.rect(0,0,cw,ch); ctx.clip();
    ctx.translate(Math.floor(cw/2), ch-2); ctx.scale(S,S); draw(ctx); ctx.restore();
    return this.desc(r.page, r.x+P, r.y+P, cw, ch, 2/S);
  }
  addStrip(n,uw,uh,draw){
    const cw=Math.ceil(uw*S), ch=Math.ceil(uh*S)+2, P=this.pad;
    const r=this.alloc(n*(cw+2*P), ch+2*P); const ctx=this.pages[r.page].ctx; const out=[];
    for (let i=0;i<n;i++){
      const x=r.x+i*(cw+2*P)+P, y=r.y+P;
      ctx.save(); ctx.translate(x,y); ctx.beginPath(); ctx.rect(0,0,cw,ch); ctx.clip();
      ctx.translate(Math.floor(cw/2), ch-2); ctx.scale(S,S); draw(ctx,i); ctx.restore();
      out.push(this.desc(r.page,x,y,cw,ch,2/S));
    }
    return out;
  }
  desc(page,x,y,w,h,oy){ const A=this.size; return {page, u:x/A, v:1-(y+h)/A, uw:w/A, vh:h/A, w:w/S, h:h/S, oy}; }
}

const VERT = `
attribute vec3 offset; attribute vec4 uvRect; attribute vec2 size; attribute float flip;
varying vec2 vUv;
void main(){
  float ux = flip < 0.0 ? 1.0 - uv.x : uv.x;
  vUv = uvRect.xy + vec2(ux, uv.y) * uvRect.zw;
  vec3 p = vec3(offset.x + position.x*size.x, offset.y + position.y*size.y, offset.z);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;
const FRAG = `
precision highp float; uniform sampler2D map; varying vec2 vUv;
void main(){ vec4 c = texture2D(map, vUv); if (c.a < 0.5) discard; gl_FragColor = vec4(c.rgb, 1.0); }`;

class Layer {
  constructor(texture, cap){
    const g=new THREE.InstancedBufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([-0.5,0,0, 0.5,0,0, 0.5,1,0, -0.5,1,0],3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute([0,0, 1,0, 1,1, 0,1],2));
    g.setIndex([0,1,2, 0,2,3]);
    this.off=new Float32Array(cap*3); this.uvr=new Float32Array(cap*4); this.sz=new Float32Array(cap*2); this.fl=new Float32Array(cap);
    this.attrs=[
      new THREE.InstancedBufferAttribute(this.off,3), new THREE.InstancedBufferAttribute(this.uvr,4),
      new THREE.InstancedBufferAttribute(this.sz,2),  new THREE.InstancedBufferAttribute(this.fl,1)];
    g.setAttribute('offset',this.attrs[0]); g.setAttribute('uvRect',this.attrs[1]); g.setAttribute('size',this.attrs[2]); g.setAttribute('flip',this.attrs[3]);
    this.attrs.forEach(a=>a.setUsage(THREE.DynamicDrawUsage));
    g.instanceCount=cap;
    const m=new THREE.ShaderMaterial({uniforms:{map:{value:texture}}, vertexShader:VERT, fragmentShader:FRAG});
    this.mesh=new THREE.Mesh(g,m); this.mesh.frustumCulled=false; this.geo=g;
  }
  set(i,x,y,z,d,flip,scale=1){
    this.off[i*3]=Math.round(x); this.off[i*3+1]=Math.round(y-d.oy*scale); this.off[i*3+2]=z;
    this.uvr[i*4]=d.u; this.uvr[i*4+1]=d.v; this.uvr[i*4+2]=d.uw; this.uvr[i*4+3]=d.vh;
    this.sz[i*2]=d.w*scale; this.sz[i*2+1]=d.h*scale; this.fl[i]=flip?-1:1;
  }
  commit(){ this.attrs.forEach(a=>a.needsUpdate=true); }
}
function makeTexture(canvas){ const tex=new THREE.CanvasTexture(canvas); tex.minFilter=THREE.LinearMipmapLinearFilter; tex.magFilter=THREE.NearestFilter; tex.generateMipmaps=true; return tex; }

class SpriteSet {
  constructor(size){ this.atlas=new Atlas(size); this.recs=[]; this.layers=[]; }
  place(desc,x,y,z,flip=false,scale=1){ const r={d:desc,x,y,z,flip,scale,page:desc.page}; this.recs.push(r); return r; }
  build(scene){
    const counts=this.atlas.pages.map(()=>0); this.recs.forEach(r=>{ r.idx=counts[r.page]++; });
    this.atlas.pages.forEach((p,i)=>{ pixelate(p.canvas); const L=new Layer(makeTexture(p.canvas), Math.max(1,counts[i])); this.layers.push(L); scene.add(L.mesh); });
    this.recs.forEach(r=>{ r.layer=this.layers[r.page]; r.layer.set(r.idx,r.x,r.y,r.z,r.d,r.flip,r.scale); });
    this.layers.forEach(L=>L.commit());
  }
  update(r){ r.layer.set(r.idx,r.x,r.y,r.z,r.d,r.flip,r.scale); }
  commit(){ this.layers.forEach(L=>L.commit()); }
}

// ------------------------------------------------------------------ DRAW HELPERS
function mk(ctx){
  const h={};
  h.outline=(w=1)=>{ctx.strokeStyle=OUT;ctx.lineWidth=w;ctx.lineJoin='miter';ctx.lineCap='butt';};
  h.shape=(color,path,lw=1)=>{ctx.beginPath();path();ctx.closePath();ctx.fillStyle=color;ctx.fill();if(lw>0){h.outline(lw);ctx.stroke();}};
  h.rect=(x,y,w,hh,color,lw)=>h.shape(color,()=>ctx.rect(x,y,w,hh),lw);
  h.circle=(x,y,r,color,lw)=>h.shape(color,()=>ctx.arc(x,y,r,0,TAU),lw);
  h.ellipse=(x,y,rx,ry,color,lw)=>h.shape(color,()=>ctx.ellipse(x,y,rx,ry,0,0,TAU),lw);
  h.poly=(pts,color,lw)=>h.shape(color,()=>{ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);},lw);
  h.line=(x1,y1,x2,y2,color,w)=>{ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();};
  h.limb=(x1,y1,x2,y2,color,w)=>{ctx.lineCap='round';h.line(x1,y1,x2,y2,OUT,w+2);ctx.lineCap='round';h.line(x1,y1,x2,y2,color,w);ctx.lineCap='butt';};
  h.dot=(x,y,r,color)=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();};
  h.arcShape=(x,y,r,a0,a1,color,lw)=>h.shape(color,()=>ctx.arc(x,y,r,a0,a1),lw);
  h.px=(x,y,color)=>{ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),1,1);};
  return h;
}
function darken(hex,f){ const n=parseInt(hex.slice(1),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return '#'+[r*f|0,g*f|0,b*f|0].map(v=>Math.min(255,v).toString(16).padStart(2,'0')).join(''); }

// ------------------------------------------------------------------ PEOPLE
function genPerson(arch){
  const p={arch, scale:1, skin:pick(SKINS), hair:pick(HAIRS), hairStyle:pick([0,0,5,5,3,1]), hat:0, hatColor:pick(CLOTH),
    top:pick(CLOTH), bottom:pick(CLOTH), dress:false, cloak:false, cloakColor:pick(CLOTH), beard:false, mustache:false,
    item:null, shoe:pick(['#2a2a2a','#3a2e28','#7a5230']), belt:true, sash:pick(CLOTH), collar:true, apron:false, stripes:null, stripeW:0, glasses:false,
    armor:false, cheeks:chance(0.3), speed:rnd(18,32), fps:rnd(5,8)};
  switch(arch){
    case 'farmer': p.hat=pick([12,12,0,16]); p.dress=chance(0.3); p.top=pick(['#7a5230','#8a5a3a','#c9a06a','#7a7a72','#3f6b4a','#2f4a7a','#e8dcb8','#5f9a8a']); p.bottom=pick(['#2f4a7a','#3a2e28','#7a7a72','#e8dcb8']);
      p.item=chance(0.7)?pick(['pole','pole','basket','hoe','bucket','sack','jug']):null; p.collar=false; break;
    case 'merchant': p.hat=pick([14,14,16,0]); p.dress=chance(0.6); p.item=chance(0.7)?pick(['fan','scroll','lantern','teapot','bao','fish','sack']):null; p.mustache=chance(0.4); break;
    case 'scholar': p.hat=pick([14,13,0]); p.hairStyle=5; p.dress=true; p.top=p.bottom=pick(['#2f4a7a','#7a7a72','#e8dcb8','#3a7a78','#4b3b6b','#9fb8c4']); p.item=pick(['fan','scroll','scroll',null]); p.beard=chance(0.3); break;
    case 'official': p.hat=13; p.dress=true; p.top=p.bottom=pick(['#b83a2a','#4b3b6b','#2f4a7a','#3f6b4a','#8c2f3a']); p.sash='#e0b050'; p.item=chance(0.3)?'scroll':null; p.beard=chance(0.5); p.mustache=!p.beard; p.speed=rnd(14,22); break;
    case 'soldier': p.hat=15; p.armor=true; p.top='#6b5a3a'; p.stripes='#3a2e28'; p.stripeW=1; p.bottom=pick(['#2a2a2a','#3a2e28','#8c2f3a']); p.item=pick(['spear','spear','sword','flag','halberd']); p.mustache=chance(0.3); p.collar=false; break;
    case 'monk': p.hairStyle=2; p.dress=true; p.top=p.bottom=pick(['#d9a63a','#c56a2a','#b8683a','#7a7a72']); p.sash='#8c2f3a'; p.item=chance(0.6)?pick(['staff','bowl','beads','scroll']):null; p.cheeks=false; break;
    case 'lady': p.hairStyle=pick([6,3,7,7]); p.dress=true; p.top=p.bottom=pick(['#c98a9a','#d9a0a0','#9fb8c4','#e8dcb8','#efe3c0','#5f9a8a','#a34a5a','#d9a63a','#c9a06a']); p.sash=pick(['#b83a2a','#3f6b4a','#2f4a7a','#e0b050']);
      p.item=chance(0.7)?pick(['fan','parasol','parasol','basket','lantern']):null; p.cheeks=true; p.hat=chance(0.15)?12:0; break;
    case 'daoist': p.hairStyle=5; p.hat=14; p.hatColor='#2a2a2a'; p.dress=true; p.beard=true; p.hair='#e8dcb8'; p.top=p.bottom=pick(['#7a7a72','#9fb8c4','#2f4a7a','#e8dcb8']); p.item=pick(['staff','staff','fan']); p.speed=rnd(12,18); break;
    case 'performer': p.hat=16; p.hatColor='#b83a2a'; p.top=pick(['#d9a63a','#b83a2a','#3a7a78']); p.bottom=pick(['#2f4a7a','#8c2f3a','#e8dcb8']); p.item=pick(['fan','lantern','drum','flag']); p.cheeks=true; p.speed=rnd(24,36); break;
    case 'kid': p.scale=0.7; p.hairStyle=pick([6,6,5,0]); p.hat=chance(0.15)?12:0; p.dress=chance(0.5); p.speed=rnd(28,48); p.fps=rnd(8,11); p.cheeks=true; p.item=chance(0.3)?pick(['bao','lantern','fan','kite']):null; p.collar=chance(0.5); break;
    case 'porter': p.hat=pick([12,16,0]); p.top=pick(['#7a7a72','#e8dcb8','#c9a06a']); p.bottom=pick(['#2f4a7a','#3a2e28']); p.item='pole'; p.collar=false; p.speed=rnd(16,24); break;
    default: p.hat=chance(0.4)?pick([12,14,16,13]):0; p.dress=chance(0.5); p.item=chance(0.45)?pick(['fan','basket','lantern','scroll','jug','bao','teapot','sack']):null;
  }
  if (!p.dress && p.arch!=='kid' && !p.beard) { p.beard=chance(0.15); p.mustache=p.mustache||chance(0.15); }
  if (p.hat===15||p.hat===13) p.hairStyle=Math.min(p.hairStyle,1);
  return p;
}

function drawPerson(ctx,p,f){
  const h=mk(ctx);
  const L=[1,0,-1,0][f]; const bob=(f%2===1)?-1:0;
  ctx.save(); ctx.scale(p.scale,p.scale);
  const legLen=12, bodyH=13, headR=6;
  const hipY=-legLen, shY=hipY-bodyH+bob, headY=shY-1-headR, topY=headY-headR;
  const skin=p.skin, hair=p.hair, hc=p.hatColor;
  const holdsPole=['staff','spear','flag','halberd','hoe','parasol','lantern','banner'].includes(p.item);
  const sleeveW=p.dress?4.4:3.2;

  // ---- legs / robe
  const lx=-2.5, rx=2.5;
  const shoe=(x)=>h.rect(x-2,-3,5,3,p.shoe);
  if (p.dress){
    const lf=lx+L*2, rf=rx-L*2; shoe(lf); shoe(rf);
    h.poly([[-5,hipY-3],[-8,-1],[8,-1],[5,hipY-3]],p.bottom);
    if (p.apron) h.poly([[-3,hipY-2],[-5,-3],[5,-3],[3,hipY-2]],'#efe3c0');
  } else {
    const lf=lx+L*4, rf=rx-L*4;
    h.limb(lx,hipY+bob,lf,-2,p.bottom,3.4); shoe(lf);
    h.limb(rx,hipY+bob,rf,-2,p.bottom,3.4); shoe(rf);
  }
  if (p.cloak) h.poly([[-5.5,shY+1],[-9.5,hipY+6],[9.5,hipY+6],[5.5,shY+1]],p.cloakColor);
  if (p.hairStyle===1||p.hairStyle===7){ h.poly([[-headR+0.5,headY-2],[-headR-1,shY+5],[headR+1,shY+5],[headR-0.5,headY-2]],hair); }
  // ---- carrying pole (behind)
  if (p.item==='pole'){ h.line(-14,shY+1,14,shY-1,OUT,3.5); h.line(-14,shY+1,14,shY-1,'#c9a06a',1.8);
    for (const sx of [-14,14]){ h.line(sx,shY+1,sx,shY+9,OUT,1); h.poly([[sx-4,shY+9],[sx+4,shY+9],[sx+3,shY+15],[sx-3,shY+15]],'#c9a06a'); h.line(sx-3,shY+12,sx+3,shY+12,'#7a5230',1); } }
  // ---- back arm
  const bsx=-4.8, bsy=shY+2.5; const bhx=bsx-L*3, bhy=shY+11.5;
  if (p.item==='sack'){ h.limb(bsx,bsy,bsx-2,shY-2,p.top,sleeveW); }
  else { h.limb(bsx,bsy,bhx,bhy,p.top,sleeveW); h.circle(bhx,bhy+0.5,1.8,skin); }
  if (p.item==='sack') h.ellipse(-5,shY-2,5,4,'#c9a06a');
  // ---- body
  const bodyTop=shY, bodyBot=hipY+(p.dress?-1:1.5);
  h.rect(-5,bodyTop,10,bodyBot-bodyTop,p.top);
  if (p.stripes){ ctx.save(); ctx.beginPath(); ctx.rect(-5,bodyTop,10,bodyBot-bodyTop); ctx.clip();
    ctx.strokeStyle=p.stripes; ctx.lineWidth=p.stripeW||2; const sp=p.stripeW?2.5:4; for(let y=bodyTop+2;y<bodyBot;y+=sp){ctx.beginPath();ctx.moveTo(-6,y);ctx.lineTo(6,y);ctx.stroke();} ctx.restore(); }
  if (p.armor){ h.rect(-7,shY+1,3,4,'#8c7a5a',0.8); h.rect(4,shY+1,3,4,'#8c7a5a',0.8); h.rect(-2,shY+3,4,4,'#e0b050',0.8); }
  if (p.collar){ ctx.strokeStyle=p.dress?'#efe3c0':darken(p.top,0.7); ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-3,shY+0.5); ctx.lineTo(1,shY+6); ctx.moveTo(3,shY+0.5); ctx.lineTo(-1,shY+5); ctx.stroke(); }
  if (p.belt){ if (p.dress){ h.rect(-5,hipY-5,10,3,p.sash,0.8); h.line(1,hipY-2,1,hipY+3,p.sash,2); } else { ctx.fillStyle='#3a2e28'; ctx.fillRect(-5,hipY-3,10,2); } }
  if (p.item==='sword'){ h.limb(-4.5,hipY-1,-8.5,hipY+7,'#9fb8c4',1.4); h.line(-5.5,hipY-1.5,-3,hipY+0.5,'#e0b050',1.5); }
  h.rect(-1.5,shY-1.6,3,2.2,skin,0.8);
  // ---- front arm
  const fsx=4.8, fsy=shY+2.5; let fhx=fsx+L*3, fhy=shY+11.5;
  if (holdsPole){ fhx=6.2; fhy=shY+8.5; }
  if (p.item==='basket'||p.item==='bucket'||p.item==='bao'||p.item==='drum'){ fhx=6.5; fhy=shY+11.5; }
  h.limb(fsx,fsy,fhx,fhy,p.top,sleeveW); h.circle(fhx,fhy+0.5,1.8,skin);
  // ---- head
  h.circle(0,headY,headR,skin);
  const capOk=p.hairStyle!==2 && p.hat!==15 && p.hat!==13;
  if (capOk) h.arcShape(0,headY,headR+0.4,PI*1.08,PI*1.92,hair);
  if (p.hairStyle===3) h.circle(0,topY+0.5,2.5,hair);
  if (p.hairStyle===5 && p.hat!==13 && p.hat!==15){ h.rect(-2,topY-4,4,4.5,hair); h.line(-5,topY-2,5,topY-2,'#e0b050',1); }
  if (p.hairStyle===6){ h.circle(-5.5,topY+1.5,2.6,hair); h.circle(5.5,topY+1.5,2.6,hair); h.dot(-5.5,topY+1,0.9,'#b83a2a'); h.dot(5.5,topY+1,0.9,'#b83a2a'); }
  if (p.hairStyle===7){ h.line(-6.5,headY-1,-9,headY+3,hair,1.5); h.dot(3,topY+0.5,1.6,'#e0b050'); }
  if (p.beard){ h.poly([[-4,headY+2],[-2,headY+9],[2,headY+9],[4,headY+2]],hair); }
  h.px(-2.5,headY-1,OUT); h.px(-1.5,headY-1,OUT); h.px(1.5,headY-1,OUT); h.px(2.5,headY-1,OUT);
  if (p.cheeks){ h.px(-4,headY+1,'#d9a0a0'); h.px(4,headY+1,'#d9a0a0'); }
  if (!p.beard){ h.line(-1.5,headY+2.5,1.5,headY+2.5,OUT,1); }
  if (p.mustache){ h.line(-3,headY+2,-0.5,headY+1.5,hair,1.2); h.line(0.5,headY+1.5,3,headY+2,hair,1.2); }
  if (p.glasses){ ctx.strokeStyle=OUT; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(-2.3,headY-0.7,2.2,0,TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(2.3,headY-0.7,2.2,0,TAU); ctx.stroke(); }
  // ---- hats
  switch(p.hat){
    case 3: h.shape(hc,()=>{ctx.moveTo(-8,topY+2.5);ctx.lineTo(8,topY+2.5);ctx.quadraticCurveTo(4,topY-6,4,topY-14);ctx.quadraticCurveTo(0,topY-6,-8,topY+2.5);}); h.ellipse(0,topY+2.5,10.5,1.9,hc); break;
    case 10: { const base=p.hatBase||'#b83a2a', str=p.hatStripe||'#efe3c0';
      ctx.save(); ctx.beginPath(); ctx.arc(0,topY+3,headR+1,PI,TAU); ctx.closePath(); ctx.fillStyle=base; ctx.fill(); ctx.clip();
      ctx.strokeStyle=str; ctx.lineWidth=2; for(let y=topY+2;y>topY-8;y-=4){ctx.beginPath();ctx.moveTo(-9,y);ctx.lineTo(9,y);ctx.stroke();} ctx.restore();
      ctx.beginPath(); ctx.arc(0,topY+3,headR+1,PI,TAU); ctx.closePath(); h.outline(1); ctx.stroke(); h.circle(0,topY-4.6,2.4,str); break; }
    case 12: h.poly([[-12,topY+4],[12,topY+4],[0,topY-6]],'#c9a06a'); ctx.strokeStyle='#8a5a3a'; ctx.lineWidth=1; for(let x=-8;x<=8;x+=4){ctx.beginPath();ctx.moveTo(x,topY+3);ctx.lineTo(x*0.3,topY-3);ctx.stroke();} h.line(-12,topY+4,12,topY+4,OUT,1); break;
    case 13: h.rect(-6,topY-1,12,5,'#2a2a2a'); h.rect(-4,topY-6,8,5,'#2a2a2a'); h.rect(-14,topY+0.5,8,2,'#2a2a2a'); h.rect(6,topY+0.5,8,2,'#2a2a2a'); break;
    case 14: h.arcShape(0,topY+3,headR+0.5,PI,TAU,hc==='#2a2a2a'?'#2a2a2a':pick(['#2a2a2a','#2f4a7a','#8c2f3a'])); h.dot(0,topY-3,1.4,'#b83a2a'); break;
    case 15: h.poly([[-8,headY-1],[8,headY-1],[0,topY-6]],'#7a7a72'); h.rect(-8,headY-2,16,2,'#3a2e28',0.8); h.line(0,topY-6,0,topY-12,OUT,2); h.ellipse(0,topY-13,2,3,'#b83a2a'); break;
    case 16: h.rect(-headR-1,topY+2,2*headR+2,2.5,hc,0.8); h.line(headR,topY+3,headR+5,topY+7,hc,1.5); break;
  }
  // ---- held items (front)
  const hx=fhx, hy=fhy;
  switch(p.item){
    case 'staff': h.limb(hx+1,1,hx+1,shY-9,'#7a5230',1.8); if (p.arch==='daoist') h.dot(hx+1,shY-10,2,'#e0b050'); break;
    case 'spear': h.limb(hx+1,1,hx+1,shY-16,'#7a5230',1.6); h.poly([[hx-1,shY-16],[hx+3,shY-16],[hx+1,shY-22]],'#9fb8c4'); h.line(hx-2,shY-15,hx+4,shY-15,'#b83a2a',1.5); break;
    case 'halberd': h.limb(hx+1,1,hx+1,shY-18,'#7a5230',1.6); h.poly([[hx+1,shY-20],[hx+7,shY-16],[hx+1,shY-9]],'#9fb8c4'); h.poly([[hx-2,shY-18],[hx+4,shY-18],[hx+1,shY-23]],'#9fb8c4'); break;
    case 'hoe': h.limb(hx+1,1,hx+1,shY-8,'#7a5230',1.6); h.rect(hx-4,shY-9,7,2.5,'#7a7a72'); break;
    case 'flag': case 'banner': h.limb(hx+1,1,hx+1,shY-20,'#7a5230',1.5); h.poly([[hx+1,shY-20],[hx+10,shY-18],[hx+1,shY-9]],pick(['#b83a2a','#d9a63a','#2f4a7a'])); h.rect(hx+3,shY-17,3,3,'#e0b050',0); break;
    case 'lantern': h.limb(hx+1,hy-2,hx+1,shY-8,'#7a5230',1.5); h.line(hx+1,shY-8,hx+7,shY-8,'#7a5230',1.5); h.ellipse(hx+7,shY-3,3,4,'#b83a2a'); h.line(hx+7,shY+1,hx+7,shY+4,'#e0b050',1); break;
    case 'parasol': h.limb(hx+1,hy-1,hx+1,topY-8,'#7a5230',1.5); h.shape(pick(['#b83a2a','#d9a0a0','#d9a63a','#5f9a8a','#efe3c0']),()=>{ctx.moveTo(-14,topY-7);ctx.quadraticCurveTo(0,topY-20,14,topY-7);}); ctx.strokeStyle=OUT; ctx.lineWidth=0.8; for(let x=-10;x<=10;x+=5){ctx.beginPath();ctx.moveTo(0,topY-14);ctx.lineTo(x,topY-8);ctx.stroke();} break;
    case 'fan': h.shape('#efe3c0',()=>{ctx.moveTo(hx,hy);ctx.arc(hx,hy,6,-PI*0.95,-PI*0.05);}); ctx.strokeStyle='#8a5a3a'; ctx.lineWidth=0.8; for(let a=-PI*0.8;a<0;a+=PI*0.2){ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+Math.cos(a)*5.5,hy+Math.sin(a)*5.5);ctx.stroke();} break;
    case 'basket': h.poly([[hx-4,hy-1],[hx+4,hy-1],[hx+3,hy+4.5],[hx-3,hy+4.5]],'#c9a06a'); h.line(hx-3,hy+1.5,hx+3,hy+1.5,'#8a5a3a',1); ctx.beginPath(); ctx.arc(hx,hy-1,3.2,PI,TAU); h.outline(1.2); ctx.stroke(); h.dot(hx-1.5,hy-1.5,1.1,'#b83a2a'); h.dot(hx+1.5,hy-1.7,1.1,'#6b8f5a'); break;
    case 'bucket': h.poly([[hx-3.4,hy],[hx+3.4,hy],[hx+2.6,hy+5.5],[hx-2.6,hy+5.5]],'#7a5230'); ctx.beginPath(); ctx.arc(hx,hy,3,PI,TAU); h.outline(1); ctx.stroke(); break;
    case 'bao': h.rect(hx-4,hy+1,8,2,'#7a5230'); h.dot(hx-2,hy,1.6,'#efe3c0'); h.dot(hx+2,hy,1.6,'#efe3c0'); h.dot(hx,hy-2,1.6,'#efe3c0'); break;
    case 'jug': h.poly([[hx-2,hy-2],[hx+2,hy-2],[hx+3,hy+4],[hx-3,hy+4]],'#7a5230'); break;
    case 'teapot': h.ellipse(hx,hy+1,3.4,2.6,'#7a5230'); h.line(hx+3,hy,hx+6,hy-3,'#7a5230',1.6); h.dot(hx,hy-2,1,'#7a5230'); break;
    case 'bowl': h.arcShape(hx,hy-1,3.5,0,PI,'#9fb8c4'); break;
    case 'beads': ctx.strokeStyle='#7a5230'; ctx.lineWidth=1.5; ctx.setLineDash([1,1]); ctx.beginPath(); ctx.ellipse(0,shY+5,4.5,6,0,0,TAU); ctx.stroke(); ctx.setLineDash([]); break;
    case 'fish': h.ellipse(hx+1,hy+1,3.8,1.6,'#9fb8c4'); h.poly([[hx+4.5,hy+1],[hx+6.5,hy-1],[hx+6.5,hy+3]],'#9fb8c4'); break;
    case 'scroll': h.rect(hx-1.5,hy-3,3,7,'#efe3c0'); h.line(hx-1.5,hy-3,hx+1.5,hy-3,'#7a5230',1); h.line(hx-1.5,hy+4,hx+1.5,hy+4,'#7a5230',1); break;
    case 'drum': h.ellipse(hx,hy+1,4,3,'#b83a2a'); h.line(hx-4,hy+1,hx+4,hy+1,'#e0b050',1); break;
    case 'kite': h.line(hx,hy,hx+8,topY-10,'#7a7a72',0.8); h.poly([[hx+8,topY-16],[hx+13,topY-10],[hx+8,topY-4],[hx+3,topY-10]],pick(['#b83a2a','#d9a63a','#3a7a78'])); break;
  }
  ctx.restore();
}

// ---- animals
function drawDog(ctx,a,f){ const h=mk(ctx); const L=[1,-1,1,-1][f]; const c=a.color;
  h.limb(-5,-4,-5+L*2,-1,c,2.4); h.limb(4,-4,4-L*2,-1,c,2.4);
  h.ellipse(0,-6,7,3.5,c); h.limb(-2.5,-4,-2.5-L*2,-1,c,2.4); h.limb(6,-4,6+L*2,-1,c,2.4);
  if (a.stripes){ h.limb(-7,-7,-11,-12,'#efe3c0',2.2); for(let i=0;i<4;i++){const t=i/3.5; h.px(-7-4*t,-7-5*t,'#b83a2a');} }
  else h.limb(-7,-7,-11,-11,c,1.8);
  h.circle(7.5,-9,3.2,c); h.poly([[5.5,-11.5],[6.5,-15],[8.5,-11.5]],darken(c,0.7)); h.ellipse(10,-8,2,1.4,darken(c,0.8)); h.px(8,-10,OUT); h.px(11,-8.5,OUT);
}
function drawPig(ctx,a,f){ const h=mk(ctx); const L=[1,-1,1,-1][f]; const c='#d9a0a0';
  h.limb(-4.5,-4,-4.5+L*1.5,-1,c,2.6); h.limb(3.5,-4,3.5-L*1.5,-1,c,2.6);
  h.ellipse(0,-6,7.5,4.5,c); h.limb(-2,-4,-2-L*1.5,-1,c,2.6); h.limb(5.5,-4,5.5+L*1.5,-1,c,2.6);
  h.circle(7,-7.5,3.4,c); h.poly([[5,-10.5],[6,-13],[7.8,-10.5]],c); h.ellipse(9.8,-7,2,1.5,'#c98a9a'); h.px(9,-7,OUT); h.px(10.5,-7,OUT); h.px(7.5,-9,OUT);
}
function drawChicken(ctx,a,f){ const h=mk(ctx); const L=[1,-1,1,-1][f]; const c=a.color;
  h.line(-1.2,-3,-1.2+L*1.2,0,'#c56a2a',1); h.line(1.2,-3,1.2-L*1.2,0,'#c56a2a',1);
  h.ellipse(0,-4.5,4,2.8,c); h.poly([[-3.5,-5.5],[-6.5,-8],[-3,-7]],darken(c,0.8));
  h.circle(3.6,-8,1.9,c); h.poly([[3,-10],[4,-11.5],[5,-10]],'#b83a2a'); h.poly([[5.3,-8],[7.2,-7.4],[5.3,-6.9]],'#c56a2a'); h.px(4,-8.5,OUT);
}
function drawCrane(ctx,f){ const h=mk(ctx); const L=[1,-1,1,-1][f];
  h.line(-1,-12,-1+L,-1,'#2a2a2a',1); h.line(1,-12,1-L,-1,'#2a2a2a',1); h.ellipse(0,-14,6,3.5,'#efe3c0'); h.poly([[-6,-14],[-10,-11],[-5,-12]],'#2a2a2a');
  h.line(5,-16,7,-26,'#efe3c0',2); h.circle(7,-27,2,'#efe3c0'); h.px(6,-29,'#b83a2a'); h.line(9,-27,13,-26,'#2a2a2a',1.2); }
function drawBird(ctx,f){ ctx.strokeStyle=OUT; ctx.lineWidth=1.2; ctx.lineCap='round'; ctx.beginPath();
  if (f===0){ ctx.moveTo(-6,-3); ctx.quadraticCurveTo(-3,-7,0,-4); ctx.quadraticCurveTo(3,-7,6,-3); }
  else { ctx.moveTo(-6,-6); ctx.quadraticCurveTo(-3,-3,0,-5); ctx.quadraticCurveTo(3,-3,6,-6); }

// ------------------------------------------------------------------ BUILDINGS (east-asian)
function pagodaRoof(h,ctx,x0,x1,y,rh,color,ridgeInset=10,eave=8){
  const path=()=>{ ctx.moveTo(x0-eave,y-4); ctx.quadraticCurveTo(x0+3,y,x0+ridgeInset,y-rh); ctx.lineTo(x1-ridgeInset,y-rh); ctx.quadraticCurveTo(x1-3,y,x1+eave,y-4); ctx.lineTo(x1+eave-2,y+1); ctx.lineTo(x0-eave+2,y+1); };
  h.shape(color,path);
  ctx.save(); ctx.beginPath(); path(); ctx.closePath(); ctx.clip(); ctx.strokeStyle=darken(color,0.72); ctx.lineWidth=1;
  for (let yy=y-2; yy>y-rh; yy-=3){ ctx.beginPath(); ctx.moveTo(x0-eave,yy); ctx.lineTo(x1+eave,yy); ctx.stroke(); }
  ctx.restore();
  h.line(x0+ridgeInset-1,y-rh,x1-ridgeInset+1,y-rh,darken(color,0.6),2.5);
  h.rect(x0+ridgeInset-2,y-rh-4,3,4,darken(color,0.6),0.8); h.rect(x1-ridgeInset-1,y-rh-4,3,4,darken(color,0.6),0.8);
  h.line(x0-eave+2,y+1,x1+eave-2,y+1,'#8c3b2c',1.5);
  h.outline(1); ctx.beginPath(); path(); ctx.closePath(); ctx.stroke();
}
function lattice(h,ctx,x,y,w,hh){ h.rect(x,y,w,hh,'#3a2e28'); ctx.strokeStyle='#c9a06a'; ctx.lineWidth=1; ctx.beginPath(); for(let xx=x+3;xx<x+w;xx+=3){ctx.moveTo(xx,y);ctx.lineTo(xx,y+hh);} for(let yy=y+3;yy<y+hh;yy+=3){ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);} ctx.stroke(); }
function stoneBase(h,ctx,x,y,w,hh){ h.rect(x,y,w,hh,STONE); ctx.strokeStyle=darken(STONE,0.75); ctx.lineWidth=1; for(let yy=y+3;yy<y+hh;yy+=3){ ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+w,yy); ctx.stroke(); const off=((yy/3)|0)%2?4:0; for(let xx=x+off;xx<x+w;xx+=8){ ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx,yy-3); ctx.stroke(); } } }
function brickWall(h,ctx,x,y,w,hh,color=BRICK){ h.rect(x,y,w,hh,color); ctx.strokeStyle=BRICK_D; ctx.lineWidth=1; for(let yy=y+4;yy<y+hh;yy+=4){ ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+w,yy); ctx.stroke(); const off=((yy/4)|0)%2?5:0; for(let xx=x+off;xx<x+w;xx+=10){ ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx,yy-4); ctx.stroke(); } } ctx.fillStyle=BRICK_L; for(let i=0;i<w*hh/60;i++) ctx.fillRect(x+Math.floor(rnd(0,w/5))*5, y+Math.floor(rnd(0,hh/4))*4+1, 4, 2); }
function crenels(h,x,y,w,size,color){ for(let cx=x; cx<x+w-size*0.5; cx+=size*2) h.rect(cx,y-size,size,size,color,1); }
function railing(h,ctx,x,y,w,color='#8c3b2c'){ h.line(x,y,x+w,y,color,2); for(let xx=x;xx<=x+w;xx+=4) h.line(xx,y,xx,y+4,color,1); }

function genHouse(front){
  const w=rndi(52,96);
  const wallH=front?rndi(26,40):rndi(30,44), roofH=front?rndi(14,22):rndi(16,24);
  const tiers=front?(chance(0.15)?2:1):(chance(0.6)?2:1);
  return {w,wallH,roofH,tiers, wall:pick(WALLS), col:pick(COLUMN), roof:pick(ROOFS), lanterns:chance(0.5), sign:chance(0.3), door:rnd(-0.5,0.5), stone:chance(0.3), bays:Math.max(2,Math.round(w/24))};
}
function drawHouse(ctx,b){
  const h=mk(ctx); const {w,roofH}=b; const x0=-w/2, x1=w/2;
  stoneBase(h,ctx,x0,-5,w,5);
  let y=-5; const wh=b.wallH;
  if (b.stone) brickWall(h,ctx,x0,y-wh,w,wh,'#b8b0a0'); else h.rect(x0,y-wh,w,wh,b.wall);
  const bays=b.bays, bw=w/bays; const doorBay=Math.min(bays-1,Math.max(0,Math.floor((b.door+0.5)*bays)));
  for(let i=0;i<bays;i++){ const bx=x0+i*bw;
    if (i===doorBay){ h.rect(bx+bw/2-6,y-16,12,16,'#8c2f3a'); h.line(bx+bw/2,y-16,bx+bw/2,y,OUT,1); h.px(bx+bw/2-3,y-8,'#e0b050'); h.px(bx+bw/2+2,y-8,'#e0b050'); }
    else lattice(h,ctx,bx+bw/2-6,y-wh+6,12,Math.min(12,wh-12));
  }
  for(let i=0;i<=bays;i++){ const cx=x0+i*bw; h.rect(Math.max(x0,Math.min(x1-3,cx-1.5)),y-wh,3,wh,b.col,0.8); }

function step(e,dt){
  if (e.pause>0){ e.pause-=dt; if (e.idle && chance(0.004)) e.flip=!e.flip; return; }
  const dx=e.tx-e.x, dy=e.ty-e.y, dist=Math.hypot(dx,dy);
  if (dist<2){
    if (e.mode==='street'){ const nb=neighbors(...e.node).filter(n=>!(n[0]===e.prev[0]&&n[1]===e.prev[1])); const next=nb.length?pick(nb):e.prev; e.prev=e.node; e.node=next; const [nx,ny]=nodePos(...next); e.tx=nx+rnd(-32,32); e.ty=ny+rnd(-32,32); }
    else if (e.mode==='plaza') pickPlaza(e); else if (e.mode==='yard') pickYard(e); else pickField(e);
    if (chance(e.pauseChance)) e.pause=rnd(0.8,5);
    return;
  }
  const v=e.speed*dt; const k=Math.min(1,v/dist); e.x+=dx*k; e.y+=dy*k;
  if (Math.abs(dx)>0.5) e.flip=dx<0;
  if (e.mode==='plaza'){ const fx=e.x-CENTER.x, fy=e.y-CENTER.y, fd=Math.hypot(fx,fy); if (fd<50){ e.x=CENTER.x+fx/fd*50; e.y=CENTER.y+fy/fd*50; } }
}
const clock=new THREE.Clock(); let t=0, frames=0, fpsT=0;
const stats=document.getElementById('stats');
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,clock.getDelta()); t+=dt;
  for(const e of people){
    step(e,dt);
    const f=e.pause>0?e.standFrame:Math.floor(t*e.fps+e.phase)%4;
    const r=e.rec; r.x=e.x; r.y=e.y; r.z=zOf(e.y); r.d=e.frames[f]; r.flip=e.flip; dyn.update(r);
  }
  for(const b of birds){ b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.x<-20) b.x=W+20; if(b.x>W+20) b.x=-20; if(b.y<0||b.y>H) b.vy=-b.vy; const r=b.rec; r.x=b.x; r.y=b.y; r.d=birdFrames[Math.floor(t*6+b.phase)%2]; r.flip=b.vx<0; dyn.update(r); }
  for(const k in specials){ const s=specials[k]; if(s.ring){ s.ring.x=s.e.x; s.ring.y=s.e.y+(s.e.kind==='dog'?-14:0); dyn.update(s.ring); } }
  dyn.commit();
  renderer.render(scene,camera);
  frames++; fpsT+=dt; if (fpsT>0.5){ stats.textContent=`${Math.round(frames/fpsT)} fps · ${people.length} characters · zoom ${zoom.toFixed(2)}`; frames=0; fpsT=0; }
}
document.getElementById('loading').remove();
animate();
</script>
