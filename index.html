<!DOCTYPE html>

<head>

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2e5a2e;font-family:'Press Start 2P',ui-monospace,Menlo,monospace}
  canvas{display:block;image-rendering:pixelated}
  .win{background:linear-gradient(#3e58d0,#1c2a80);border:4px solid #f8f8f8;border-radius:8px;
       box-shadow:0 0 0 4px #10183a,6px 6px 0 4px rgba(0,0,0,.35);color:#fff}
  #hud{position:fixed;top:16px;left:16px;padding:14px 16px;max-width:280px;user-select:none}
  #hud h1{margin:0 0 10px;font-size:14px;color:#ffd84a;text-shadow:2px 2px 0 #10183a;letter-spacing:1px}
  #hud p{margin:6px 0;font-size:9px;line-height:1.8;text-shadow:1px 1px 0 #10183a}
  #hud ul{margin:8px 0 0;padding:0;list-style:none}
  #hud li{font-size:10px;margin:7px 0;text-shadow:1px 1px 0 #10183a}
  #hud li.found{color:#7dff8a;text-decoration:line-through}

  #msg{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);padding:16px 24px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
  #stats{position:fixed;bottom:10px;right:12px;color:#fff;font:11px monospace;text-shadow:1px 1px 0 #000;pointer-events:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#10183a;color:#fff;font-size:16px}

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

// ------------------------------------------------------------------ RNG
let seed = 20260921;
const qs = new URLSearchParams(location.search);
if (qs.get('seed')) seed = +qs.get('seed');
function rand(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rnd = (a,b)=>a+rand()*(b-a);
const rndi = (a,b)=>Math.floor(rnd(a,b+1));
const pick = a=>a[Math.floor(rand()*a.length)];
const chance = p=>rand()<p;
const PI = Math.PI, TAU = Math.PI*2;

// ------------------------------------------------------------------ WORLD LAYOUT
const W = 2600, H = 2040;      // world units (y up); top strip is the mountain vista
const S = 1;                   // sprite texels per world unit
const STREET = 100, BW = 270, BH = 255, COLS = 6, ROWS = 4, X0 = 140, Y0 = 140;
const YT = Y0 + ROWS*(BH+STREET) + STREET;
const SX = [], SY = [];
for (let c=0;c<=COLS;c++) SX.push(X0 + c*(BW+STREET) + STREET/2);
for (let r=0;r<=ROWS;r++) SY.push(Y0 + r*(BH+STREET) + STREET/2);
const block = (c,r)=>({x:X0+STREET+c*(BW+STREET), y:Y0+STREET+r*(BH+STREET), w:BW, h:BH});
const PLAZA  = {...block(2,1), w:BW*2+STREET};
const FORT   = {...block(2,3), w:BW*2+STREET};
const CENTER = {x:PLAZA.x+PLAZA.w/2, y:PLAZA.y+PLAZA.h/2};
const INNER = {x0:X0-30, y0:Y0-30, x1:W-X0+30, y1:YT+30};
const FIELD_TOP = YT+150;
const zOf = y => 1 + (H - y) / H * 50;
const inRect = (x,y,r)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;

// ------------------------------------------------------------------ PALETTE (bright 16-bit RPG)
const OUT = '#2a1f2d';
const SKINS = ['#f8d8b8','#f0c498','#e0a878','#c88a5a','#a86a42','#80502e'];
const HAIRS = ['#2a2030','#3a2a22','#4a3020','#6a4a2a','#9a9aa8','#f0e0b0'];
const CLOTH = ['#e04a3a','#3a6ad8','#3aa04a','#f0b830','#8a4ab0','#f07a2a','#8a5a32','#2aa0a0','#f08ab0','#f0e8d0',
               '#8a8a96','#3a3440','#c0303a','#5a9ae8','#7ac050','#ffd050','#5a4ab0','#d04a6a','#5ac0a0','#a0603a',
               '#d8b078','#a8d0e8','#f0a8a8','#fff4d8','#7aa0c8','#d8783a'];
const ROOFS = ['#3a9ab0','#2f7fc8','#3aa060','#d8683a','#c8463a','#6a7fa0','#2aa890','#7a5ac0'];
const WALLS = ['#fbf2dc','#f6e8c8','#fff8e6','#f0dcb4','#f4e0c0','#eae4d4'];
const COLUMN = ['#d0402e','#b8302a','#e0502e','#a82e24'];
const GREENS = ['#3aa848','#4cb85a','#2e9a44','#58c060','#38a070'];
const BRICK='#c0b6a2', BRICK_D='#8e8474', BRICK_L='#dcd4c2', STONE='#a8a49a', STONE_L='#d0ccc0';
const GRASS='#6cc04c', GRASS_D='#4ea23a', GRASS_DD='#3a8430', GRASS_L='#90d866', GRASS_M='#62b446';
const PATH='#e0cfa4', PATH_V='#d8c69a', PATH_V2='#e6d7b0', PATH_D='#b49c70', PATH_L='#f4e8c8';
const PLZ='#ecdcb4', PLZ_D='#c2ac80', PLZ_L='#fff4d4';
const DIRT='#c8945a', DIRT_D='#a07040';
const WATER='#4aa8e0', WATER_D='#2f80c0', WATER_L='#a8e0ff';
const SHADOWC='#a49cc8';

const REG = new Set();
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function toHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function darken(hex,f){ const [r,g,b]=hex2rgb(hex); const o=toHex(r*f,g*f,b*f); REG.add(o); return o; }
function mix(a,b,t){ const A=hex2rgb(a), B=hex2rgb(b); const o=toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t); REG.add(o); return o; }

// ------------------------------------------------------------------ PIXEL QUANTIZATION + SHADING
let PAL=null, LUT=null, PALR, PALG, PALB;
function buildPalette(){
  const src=document.querySelector('script[type="module"]').textContent;
  const set=new Set((src.match(/#[0-9a-f]{6}\b/gi)||[]).map(s=>s.toLowerCase()));
  for (const c of REG) set.add(c);
  PAL=[...set].map(hex2rgb); PALR=PAL.map(c=>c[0]); PALG=PAL.map(c=>c[1]); PALB=PAL.map(c=>c[2]); LUT=new Int16Array(32768).fill(-1);
}
function pixelate(canvas){
  const ctx=canvas.getContext('2d'); const img=ctx.getImageData(0,0,canvas.width,canvas.height); const d=img.data;
  for (let i=0;i<d.length;i+=4){
    if (d[i+3]<110){ d[i]=d[i+1]=d[i+2]=d[i+3]=0; continue; }
    d[i+3]=255; const r=d[i],g=d[i+1],b=d[i+2]; const key=((r>>3)<<10)|((g>>3)<<5)|(b>>3); let k=LUT[key];
    if (k<0){ let best=1e9; for (let j=0;j<PAL.length;j++){ const dr=PALR[j]-r,dg=PALG[j]-g,db=PALB[j]-b; const dist=dr*dr*2+dg*dg*3+db*db; if (dist<best){best=dist;k=j;} } LUT[key]=k; }
    d[i]=PALR[k]; d[i+1]=PALG[k]; d[i+2]=PALB[k];
  }
  ctx.putImageData(img,0,0);
}
// classic pixel-art rim shading: lit top-left inner edge, shaded bottom-right inner edge
function autoShade(canvas){
  const ctx=canvas.getContext('2d'), w=canvas.width, hgt=canvas.height; const img=ctx.getImageData(0,0,w,hgt); const d=img.data; const o=new Uint8ClampedArray(d);
  const [r0,g0,b0]=hex2rgb(OUT); const W4=w*4;
  const edge=i=>d[i+3]===0||(d[i]===r0&&d[i+1]===g0&&d[i+2]===b0);
  for (let y=1;y<hgt-1;y++) for (let x=1;x<w-1;x++){
    const i=(y*w+x)*4; if (d[i+3]===0 || (d[i]===r0&&d[i+1]===g0&&d[i+2]===b0)) continue;
    const L=edge(i-4), R=edge(i+4), U=edge(i-W4), Dn=edge(i+W4); let f=1;
    if ((R&&!L)||(Dn&&!U)) f=0.8; else if ((L&&!R)||(U&&!Dn)) f=1.14;
    if (f!==1){ o[i]=d[i]*f; o[i+1]=d[i+1]*f; o[i+2]=d[i+2]*f; }
  }
  img.data.set(o); ctx.putImageData(img,0,0);
}

// ------------------------------------------------------------------ ATLAS + LAYERS
class Atlas {
  constructor(size){ this.size=size; this.pages=[]; this.pad=2; this.newPage(); }
  newPage(){ const c=document.createElement('canvas'); c.width=c.height=this.size; const ctx=c.getContext('2d'); this.pages.push({canvas:c,ctx,x:0,y:0,shelf:0}); }
  alloc(w,h){
    let p=this.pages[this.pages.length-1];
    if (p.x+w>this.size){ p.y+=p.shelf; p.x=0; p.shelf=0; }
    if (p.y+h>this.size){ this.newPage(); p=this.pages[this.pages.length-1]; }
    const r={page:this.pages.length-1,x:p.x,y:p.y}; p.x+=w; p.shelf=Math.max(p.shelf,h); return r;
  }
  addUnit(uw,uh,draw){
    const cw=Math.ceil(uw*S), ch=Math.ceil(uh*S)+2, P=this.pad;
    const r=this.alloc(cw+2*P, ch+2*P); const ctx=this.pages[r.page].ctx;
    ctx.save(); ctx.translate(r.x+P, r.y+P); ctx.beginPath(); ctx.rect(0,0,cw,ch); ctx.clip();
    ctx.translate(Math.floor(cw/2), ch-2); ctx.scale(S,S); draw(ctx); ctx.restore();
    return this.desc(r.page, r.x+P, r.y+P, cw, ch, 2/S);
  }
  addStrip(n,uw,uh,draw){
    const cw=Math.ceil(uw*S), ch=Math.ceil(uh*S)+2, P=this.pad;
    const r=this.alloc(n*(cw+2*P), ch+2*P); const ctx=this.pages[r.page].ctx; const out=[];
    for (let i=0;i<n;i++){
      const x=r.x+i*(cw+2*P)+P, y=r.y+P;
      ctx.save(); ctx.translate(x,y); ctx.beginPath(); ctx.rect(0,0,cw,ch); ctx.clip();
      ctx.translate(Math.floor(cw/2), ch-2); ctx.scale(S,S); draw(ctx,i); ctx.restore();
      out.push(this.desc(r.page,x,y,cw,ch,2/S));
    }
    return out;
  }
  desc(page,x,y,w,h,oy){ const A=this.size; return {page, u:x/A, v:1-(y+h)/A, uw:w/A, vh:h/A, w:w/S, h:h/S, oy}; }
}

const VERT = `
attribute vec3 offset; attribute vec4 uvRect; attribute vec2 size; attribute float flip;
varying vec2 vUv;
void main(){
  float ux = flip < 0.0 ? 1.0 - uv.x : uv.x;
  vUv = uvRect.xy + vec2(ux, uv.y) * uvRect.zw;
  vec3 p = vec3(offset.x + position.x*size.x, offset.y + position.y*size.y, offset.z);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;
const FRAG = `
precision highp float; uniform sampler2D map; varying vec2 vUv;
void main(){ vec4 c = texture2D(map, vUv); if (c.a < 0.5) discard; gl_FragColor = vec4(c.rgb, 1.0); }`;

class Layer {
  constructor(texture, cap){
    const g=new THREE.InstancedBufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([-0.5,0,0, 0.5,0,0, 0.5,1,0, -0.5,1,0],3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute([0,0, 1,0, 1,1, 0,1],2));
    g.setIndex([0,1,2, 0,2,3]);
    this.off=new Float32Array(cap*3); this.uvr=new Float32Array(cap*4); this.sz=new Float32Array(cap*2); this.fl=new Float32Array(cap);
    this.attrs=[
      new THREE.InstancedBufferAttribute(this.off,3), new THREE.InstancedBufferAttribute(this.uvr,4),
      new THREE.InstancedBufferAttribute(this.sz,2),  new THREE.InstancedBufferAttribute(this.fl,1)];
    g.setAttribute('offset',this.attrs[0]); g.setAttribute('uvRect',this.attrs[1]); g.setAttribute('size',this.attrs[2]); g.setAttribute('flip',this.attrs[3]);
    this.attrs.forEach(a=>a.setUsage(THREE.DynamicDrawUsage));
    g.instanceCount=cap;
    const m=new THREE.ShaderMaterial({uniforms:{map:{value:texture}}, vertexShader:VERT, fragmentShader:FRAG});
    this.mesh=new THREE.Mesh(g,m); this.mesh.frustumCulled=false;
  }
  set(i,x,y,z,d,flip,scale=1){
    this.off[i*3]=Math.round(x); this.off[i*3+1]=Math.round(y-d.oy*scale); this.off[i*3+2]=z;
    this.uvr[i*4]=d.u; this.uvr[i*4+1]=d.v; this.uvr[i*4+2]=d.uw; this.uvr[i*4+3]=d.vh;
    this.sz[i*2]=d.w*scale; this.sz[i*2+1]=d.h*scale; this.fl[i]=flip?-1:1;
  }
  commit(){ this.attrs.forEach(a=>a.needsUpdate=true); }
}
function makeTexture(canvas){ const tex=new THREE.CanvasTexture(canvas); tex.minFilter=THREE.LinearMipmapLinearFilter; tex.magFilter=THREE.NearestFilter; tex.generateMipmaps=true; return tex; }

class SpriteSet {
  constructor(size){ this.atlas=new Atlas(size); this.recs=[]; this.layers=[]; }
  place(desc,x,y,z,flip=false,scale=1){ const r={d:desc,x,y,z,flip,scale,page:desc.page}; this.recs.push(r); return r; }
  build(scene,shade=false){
    const counts=this.atlas.pages.map(()=>0); this.recs.forEach(r=>{ r.idx=counts[r.page]++; });
    this.atlas.pages.forEach((p,i)=>{ pixelate(p.canvas); if (shade) autoShade(p.canvas); const L=new Layer(makeTexture(p.canvas), Math.max(1,counts[i])); this.layers.push(L); scene.add(L.mesh); });
    this.recs.forEach(r=>{ r.layer=this.layers[r.page]; r.layer.set(r.idx,r.x,r.y,r.z,r.d,r.flip,r.scale); });
    this.layers.forEach(L=>L.commit());
  }
  update(r){ r.layer.set(r.idx,r.x,r.y,r.z,r.d,r.flip,r.scale); }
  commit(){ this.layers.forEach(L=>L.commit()); }
}

// pixel-snapped soft drop shadows under moving characters
class ShadowLayer {
  constructor(cap){
    const g=new THREE.InstancedBufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([-1,-1,0, 1,-1,0, 1,1,0, -1,1,0],3));
    g.setIndex([0,1,2, 0,2,3]);
    this.c=new Float32Array(cap*2); this.r=new Float32Array(cap*2);
    this.attrs=[new THREE.InstancedBufferAttribute(this.c,2), new THREE.InstancedBufferAttribute(this.r,2)];
    this.attrs.forEach(a=>a.setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('center',this.attrs[0]); g.setAttribute('radius',this.attrs[1]); g.instanceCount=cap;
    const m=new THREE.ShaderMaterial({transparent:true, depthWrite:false,
      vertexShader:`attribute vec2 center; attribute vec2 radius; varying vec2 vW; varying vec2 vC; varying vec2 vR;
        void main(){ vec2 w=center+position.xy*(radius+1.0); vW=w; vC=center; vR=radius; gl_Position=projectionMatrix*modelViewMatrix*vec4(w,0.5,1.0); }`,
      fragmentShader:`precision highp float; varying vec2 vW; varying vec2 vC; varying vec2 vR;
        void main(){ vec2 p=(floor(vW)+0.5-vC)/vR; if (dot(p,p)>1.0) discard; gl_FragColor=vec4(0.12,0.07,0.25,0.30); }`});
    this.mesh=new THREE.Mesh(g,m); this.mesh.frustumCulled=false;
  }
  set(i,x,y,rx,ry){ this.c[i*2]=x; this.c[i*2+1]=y; this.r[i*2]=rx; this.r[i*2+1]=ry; }
  commit(){ this.attrs.forEach(a=>a.needsUpdate=true); }
}

// ------------------------------------------------------------------ DRAW HELPERS
function P(ctx,x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h))); }
function box(ctx,x,y,w,h,c){ P(ctx,x,y,w,h,OUT); if (w>2&&h>2) P(ctx,x+1,y+1,w-2,h-2,c); }
function disc(ctx,cx,cy,r,c){ ctx.fillStyle=c; const R=Math.ceil(r); for(let dy=-R;dy<=R;dy++){ const v=r*r-dy*dy; if (v<0) continue; const hw=Math.round(Math.sqrt(v)); ctx.fillRect(Math.round(cx)-hw,Math.round(cy)+dy,hw*2+1,1); } }
function ellR(ctx,cx,cy,rx,ry,c){ ctx.fillStyle=c; for(let dy=-ry;dy<=ry;dy++){ const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry)))); ctx.fillRect(Math.round(cx)-hw,Math.round(cy)+dy,hw*2+1,1); } }
function mk(ctx){
  const h={};
  h.outline=(w=1)=>{ctx.strokeStyle=OUT;ctx.lineWidth=w;ctx.lineJoin='miter';ctx.lineCap='butt';};
  h.shape=(color,path,lw=1)=>{ctx.beginPath();path();ctx.closePath();ctx.fillStyle=color;ctx.fill();if(lw>0){h.outline(lw);ctx.stroke();}};
  h.rect=(x,y,w,hh,color,lw=1)=>{ const xi=Math.round(x), yi=Math.round(y), wi=Math.max(1,Math.round(w)), hi=Math.max(1,Math.round(hh));
    if (lw===0||wi<=2||hi<=2){ ctx.fillStyle=color; ctx.fillRect(xi,yi,wi,hi); return; }
    ctx.fillStyle=OUT; ctx.fillRect(xi,yi,wi,hi); ctx.fillStyle=color; ctx.fillRect(xi+1,yi+1,wi-2,hi-2); };
  h.circle=(x,y,r,color,lw)=>h.shape(color,()=>ctx.arc(x,y,r,0,TAU),lw);
  h.ellipse=(x,y,rx,ry,color,lw)=>h.shape(color,()=>ctx.ellipse(x,y,rx,ry,0,0,TAU),lw);
  h.poly=(pts,color,lw)=>h.shape(color,()=>{ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);},lw);
  h.line=(x1,y1,x2,y2,color,w)=>{ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();};
  h.limb=(x1,y1,x2,y2,color,w)=>{ctx.lineCap='round';h.line(x1,y1,x2,y2,OUT,w+2);ctx.lineCap='round';h.line(x1,y1,x2,y2,color,w);ctx.lineCap='butt';};
  h.dot=(x,y,r,color)=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();};
  h.arcShape=(x,y,r,a0,a1,color,lw)=>h.shape(color,()=>ctx.arc(x,y,r,a0,a1),lw);
  h.px=(x,y,color)=>{ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),1,1);};
  return h;
}

// ------------------------------------------------------------------ PEOPLE
function genPerson(arch){
  const p={arch, scale:1, skin:pick(SKINS), hair:pick(HAIRS), hairStyle:pick([0,0,5,5,3,1]), hat:0, hatColor:pick(CLOTH),
    top:pick(CLOTH), bottom:pick(CLOTH), dress:false, cloak:false, cloakColor:pick(CLOTH), beard:false, mustache:false,
    item:null, shoe:pick(['#3a3440','#3a2a22','#8a5a32']), belt:true, sash:pick(CLOTH), collar:true, apron:false, stripes:null, stripeW:0, glasses:false,
    armor:false, cheeks:chance(0.3), speed:rnd(18,32), fps:rnd(5,8)};
  switch(arch){
    case 'farmer': p.hat=pick([12,12,0,16]); p.dress=chance(0.3); p.top=pick(['#8a5a32','#a0603a','#d8b078','#8a8a96','#3aa04a','#3a6ad8','#f0e8d0','#5ac0a0']); p.bottom=pick(['#3a6ad8','#3a2a22','#8a8a96','#f0e8d0']);
      p.item=chance(0.7)?pick(['pole','pole','basket','hoe','bucket','sack','jug']):null; p.collar=false; break;
    case 'merchant': p.hat=pick([14,14,16,0]); p.dress=chance(0.6); p.item=chance(0.7)?pick(['fan','scroll','lantern','teapot','bao','fish','sack']):null; p.mustache=chance(0.4); break;
    case 'scholar': p.hat=pick([14,13,0]); p.hairStyle=5; p.dress=true; p.top=p.bottom=pick(['#3a6ad8','#8a8a96','#f0e8d0','#2aa0a0','#5a4ab0','#a8d0e8']); p.item=pick(['fan','scroll','scroll',null]); p.beard=chance(0.3); break;
    case 'official': p.hat=13; p.dress=true; p.top=p.bottom=pick(['#e04a3a','#5a4ab0','#3a6ad8','#3aa04a','#c0303a']); p.sash='#ffd050'; p.item=chance(0.3)?'scroll':null; p.beard=chance(0.5); p.mustache=!p.beard; p.speed=rnd(14,22); break;
    case 'soldier': p.hat=15; p.armor=true; p.top='#8a6a3a'; p.stripes='#4a3020'; p.stripeW=1; p.bottom=pick(['#3a3440','#3a2a22','#c0303a']); p.item=pick(['spear','spear','sword','flag','halberd']); p.mustache=chance(0.3); p.collar=false; break;
    case 'monk': p.hairStyle=2; p.dress=true; p.top=p.bottom=pick(['#f0b830','#f07a2a','#d8783a','#8a8a96']); p.sash='#c0303a'; p.item=chance(0.6)?pick(['staff','bowl','beads','scroll']):null; p.cheeks=false; break;
    case 'lady': p.hairStyle=pick([6,3,7,7]); p.dress=true; p.top=p.bottom=pick(['#f08ab0','#f0a8a8','#a8d0e8','#f0e8d0','#fff4d8','#5ac0a0','#d04a6a','#f0b830','#d8b078']); p.sash=pick(['#e04a3a','#3aa04a','#3a6ad8','#ffd050']);
      p.item=chance(0.7)?pick(['fan','parasol','parasol','basket','lantern']):null; p.cheeks=true; p.hat=chance(0.15)?12:0; break;
    case 'daoist': p.hairStyle=5; p.hat=14; p.hatColor='#3a3440'; p.dress=true; p.beard=true; p.hair='#f0e0b0'; p.top=p.bottom=pick(['#8a8a96','#a8d0e8','#3a6ad8','#f0e8d0']); p.item=pick(['staff','staff','fan']); p.speed=rnd(12,18); break;
    case 'performer': p.hat=16; p.hatColor='#e04a3a'; p.top=pick(['#f0b830','#e04a3a','#2aa0a0']); p.bottom=pick(['#3a6ad8','#c0303a','#f0e8d0']); p.item=pick(['fan','lantern','drum','flag']); p.cheeks=true; p.speed=rnd(24,36); break;
    case 'kid': p.scale=0.7; p.hairStyle=pick([6,6,5,0]); p.hat=chance(0.15)?12:0; p.dress=chance(0.5); p.speed=rnd(28,48); p.fps=rnd(8,11); p.cheeks=true; p.item=chance(0.3)?pick(['bao','lantern','fan','kite']):null; p.collar=chance(0.5); break;
    case 'porter': p.hat=pick([12,16,0]); p.top=pick(['#8a8a96','#f0e8d0','#d8b078']); p.bottom=pick(['#3a6ad8','#3a2a22']); p.item='pole'; p.collar=false; p.speed=rnd(16,24); break;
    default: p.hat=chance(0.4)?pick([12,14,16,13]):0; p.dress=chance(0.5); p.item=chance(0.45)?pick(['fan','basket','lantern','scroll','jug','bao','teapot','sack']):null;
  }
  if (!p.dress && p.arch!=='kid' && !p.beard) { p.beard=chance(0.15); p.mustache=p.mustache||chance(0.15); }
  if (p.hat===15||p.hat===13) p.hairStyle=Math.min(p.hairStyle,1);
  return p;
}

function drawPerson(ctx,p,f){
  const h=mk(ctx);
  const L=[1,0,-1,0][f]; const bob=(f%2===1)?-1:0;
  ctx.save(); ctx.scale(p.scale,p.scale);
  const legLen=12, bodyH=13, headR=6;
  const hipY=-legLen, shY=hipY-bodyH+bob, headY=shY-1-headR, topY=headY-headR;
  const skin=p.skin, hair=p.hair, hc=p.hatColor;
  const holdsPole=['staff','spear','flag','halberd','hoe','parasol','lantern','banner'].includes(p.item);
  const sleeveW=p.dress?4.4:3.2;

  // ---- legs / robe
  const lx=-2.5, rx=2.5;
  const shoe=(x)=>h.rect(x-2,-3,5,3,p.shoe);
  if (p.dress){
    const lf=lx+L*2, rf=rx-L*2; shoe(lf); shoe(rf);
    const robe=()=>{ctx.moveTo(-5,hipY-3);ctx.lineTo(-8,-1);ctx.lineTo(8,-1);ctx.lineTo(5,hipY-3);};
    h.shape(p.bottom,robe,0);
    ctx.save(); ctx.beginPath(); robe(); ctx.closePath(); ctx.clip();
    ctx.fillStyle=darken(p.bottom,0.76); ctx.fillRect(2,hipY-4,10,20); ctx.fillStyle=darken(p.bottom,1.14); ctx.fillRect(-9,hipY-4,3,20); ctx.restore();
    ctx.beginPath(); robe(); ctx.closePath(); h.outline(1); ctx.stroke();
    if (p.apron) h.poly([[-3,hipY-2],[-5,-3],[5,-3],[3,hipY-2]],'#fff4d8');
  } else {
    const lf=lx+L*4, rf=rx-L*4;
    h.limb(lx,hipY+bob,lf,-2,p.bottom,3.4); shoe(lf);
    h.limb(rx,hipY+bob,rf,-2,p.bottom,3.4); shoe(rf);
  }
  if (p.cloak) h.poly([[-5.5,shY+1],[-9.5,hipY+6],[9.5,hipY+6],[5.5,shY+1]],p.cloakColor);
  if (p.hairStyle===1||p.hairStyle===7){ h.poly([[-headR+0.5,headY-2],[-headR-1,shY+5],[headR+1,shY+5],[headR-0.5,headY-2]],hair); }
  // ---- carrying pole (behind)
  if (p.item==='pole'){ h.line(-14,shY+1,14,shY-1,OUT,3.5); h.line(-14,shY+1,14,shY-1,'#d8b078',1.8);
    for (const sx of [-14,14]){ h.line(sx,shY+1,sx,shY+9,OUT,1); h.poly([[sx-4,shY+9],[sx+4,shY+9],[sx+3,shY+15],[sx-3,shY+15]],'#d8b078'); h.line(sx-3,shY+12,sx+3,shY+12,'#8a5a32',1); } }
  // ---- back arm
  const bsx=-4.8, bsy=shY+2.5; const bhx=bsx-L*3, bhy=shY+11.5;
  if (p.item==='sack'){ h.limb(bsx,bsy,bsx-2,shY-2,p.top,sleeveW); }
  else { h.limb(bsx,bsy,bhx,bhy,p.top,sleeveW); h.circle(bhx,bhy+0.5,1.8,skin); }
  if (p.item==='sack') h.ellipse(-5,shY-2,5,4,'#d8b078');
  // ---- body (with shading ramp)
  const bodyTop=shY, bodyBot=hipY+(p.dress?-1:1.5);
  h.rect(-5,bodyTop,10,bodyBot-bodyTop,p.top);
  P(ctx,2,bodyTop+1,2,bodyBot-bodyTop-2,darken(p.top,0.76));
  P(ctx,-4,bodyTop+1,1,bodyBot-bodyTop-2,darken(p.top,1.16));
  if (p.stripes){ ctx.save(); ctx.beginPath(); ctx.rect(-4,bodyTop+1,8,bodyBot-bodyTop-2); ctx.clip();
    ctx.fillStyle=p.stripes; const sw=p.stripeW||2, sp=p.stripeW?3:4; for(let y=Math.round(bodyTop)+2;y<bodyBot;y+=sp) ctx.fillRect(-5,y,10,sw); ctx.restore(); }
  if (p.armor){ h.rect(-7,shY+1,3,4,'#a08a5a',0.8); h.rect(4,shY+1,3,4,'#a08a5a',0.8); h.rect(-2,shY+3,4,4,'#ffd050',0.8); }
  if (p.collar){ ctx.strokeStyle=p.dress?'#fff4d8':darken(p.top,0.7); ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(-3,shY+0.5); ctx.lineTo(1,shY+6); ctx.moveTo(3,shY+0.5); ctx.lineTo(-1,shY+5); ctx.stroke(); }
  if (p.belt){ if (p.dress){ h.rect(-5,hipY-5,10,3,p.sash,0.8); h.line(1,hipY-2,1,hipY+3,p.sash,2); } else { ctx.fillStyle='#3a2a22'; ctx.fillRect(-5,hipY-3,10,2); } }
  if (p.item==='sword'){ h.limb(-4.5,hipY-1,-8.5,hipY+7,'#a8d0e8',1.4); h.line(-5.5,hipY-1.5,-3,hipY+0.5,'#ffd050',1.5); }
  h.rect(-1.5,shY-1.6,3,2.2,skin,0);
  // ---- front arm
  const fsx=4.8, fsy=shY+2.5; let fhx=fsx+L*3, fhy=shY+11.5;
  if (holdsPole){ fhx=6.2; fhy=shY+8.5; }
  if (p.item==='basket'||p.item==='bucket'||p.item==='bao'||p.item==='drum'){ fhx=6.5; fhy=shY+11.5; }
  h.limb(fsx,fsy,fhx,fhy,p.top,sleeveW); h.circle(fhx,fhy+0.5,1.8,skin);
  // ---- head (shaded)
  h.circle(0,headY,headR,skin);
  ctx.save(); ctx.beginPath(); ctx.arc(0,headY,headR-0.6,0,TAU); ctx.clip(); P(ctx,2,headY-headR,headR,2*headR,darken(skin,0.86)); ctx.restore();
  const capOk=p.hairStyle!==2 && p.hat!==15 && p.hat!==13;
  if (capOk){ h.arcShape(0,headY,headR+0.4,PI*1.08,PI*1.92,hair); P(ctx,-3,topY+1,3,1,mix(hair,'#ffffff',0.35)); }
  if (p.hairStyle===3) h.circle(0,topY+0.5,2.5,hair);
  if (p.hairStyle===5 && p.hat!==13 && p.hat!==15){ h.rect(-2,topY-4,4,4.5,hair); h.line(-5,topY-2,5,topY-2,'#ffd050',1); }
  if (p.hairStyle===6){ h.circle(-5.5,topY+1.5,2.6,hair); h.circle(5.5,topY+1.5,2.6,hair); h.dot(-5.5,topY+1,0.9,'#e04a3a'); h.dot(5.5,topY+1,0.9,'#e04a3a'); }
  if (p.hairStyle===7){ h.line(-6.5,headY-1,-9,headY+3,hair,1.5); h.dot(3,topY+0.5,1.6,'#ffd050'); }
  if (p.beard){ h.poly([[-4,headY+2],[-2,headY+9],[2,headY+9],[4,headY+2]],hair); }
  P(ctx,-3,headY-2,1,2,OUT); P(ctx,2,headY-2,1,2,OUT);
  if (p.cheeks){ h.px(-4,headY+1,'#f0a8a8'); h.px(3,headY+1,'#f0a8a8'); }
  if (!p.beard){ P(ctx,-1,headY+2,3,1,OUT); }
  if (p.mustache){ h.line(-3,headY+2,-0.5,headY+1.5,hair,1.2); h.line(0.5,headY+1.5,3,headY+2,hair,1.2); }
  if (p.glasses){ ctx.strokeStyle=OUT; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(-2.3,headY-0.7,2.2,0,TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(2.3,headY-0.7,2.2,0,TAU); ctx.stroke(); }
  // ---- hats
  switch(p.hat){
    case 3: h.shape(hc,()=>{ctx.moveTo(-8,topY+2.5);ctx.lineTo(8,topY+2.5);ctx.quadraticCurveTo(4,topY-6,4,topY-14);ctx.quadraticCurveTo(0,topY-6,-8,topY+2.5);}); h.ellipse(0,topY+2.5,10.5,1.9,hc); break;
    case 10: { const base=p.hatBase||'#e04a3a', str=p.hatStripe||'#fff4d8';
      ctx.save(); ctx.beginPath(); ctx.arc(0,topY+3,headR+1,PI,TAU); ctx.closePath(); ctx.fillStyle=base; ctx.fill(); ctx.clip();
      ctx.fillStyle=str; for(let y=Math.round(topY)+1;y>topY-8;y-=4) ctx.fillRect(-9,y,18,2); ctx.restore();
      ctx.beginPath(); ctx.arc(0,topY+3,headR+1,PI,TAU); ctx.closePath(); h.outline(1); ctx.stroke(); h.circle(0,topY-4.6,2.4,str); break; }
    case 12: h.poly([[-12,topY+4],[12,topY+4],[0,topY-6]],'#e0c080'); ctx.strokeStyle='#a0703a'; ctx.lineWidth=1; for(let x=-8;x<=8;x+=4){ctx.beginPath();ctx.moveTo(x,topY+3);ctx.lineTo(x*0.3,topY-3);ctx.stroke();} P(ctx,-12,topY+4,24,1,OUT); break;
    case 13: h.rect(-6,topY-1,12,5,'#3a3440'); h.rect(-4,topY-6,8,5,'#3a3440'); h.rect(-14,topY+0.5,8,2,'#3a3440'); h.rect(6,topY+0.5,8,2,'#3a3440'); break;
    case 14: h.arcShape(0,topY+3,headR+0.5,PI,TAU,hc==='#3a3440'?'#3a3440':pick(['#3a3440','#3a6ad8','#c0303a'])); h.dot(0,topY-3,1.4,'#e04a3a'); break;
    case 15: h.poly([[-8,headY-1],[8,headY-1],[0,topY-6]],'#a8a8b8'); h.rect(-8,headY-2,16,2,'#4a3020',0.8); h.line(0,topY-6,0,topY-12,OUT,2); h.ellipse(0,topY-13,2,3,'#e04a3a'); break;
    case 16: h.rect(-headR-1,topY+2,2*headR+2,2.5,hc,0.8); h.line(headR,topY+3,headR+5,topY+7,hc,1.5); break;
  }
  // ---- held items (front)
  const hx=fhx, hy=fhy;
  switch(p.item){
    case 'staff': h.limb(hx+1,1,hx+1,shY-9,'#8a5a32',1.8); if (p.arch==='daoist') h.dot(hx+1,shY-10,2,'#ffd050'); break;
    case 'spear': h.limb(hx+1,1,hx+1,shY-16,'#8a5a32',1.6); h.poly([[hx-1,shY-16],[hx+3,shY-16],[hx+1,shY-22]],'#d8e8f0'); h.line(hx-2,shY-15,hx+4,shY-15,'#e04a3a',1.5); break;
    case 'halberd': h.limb(hx+1,1,hx+1,shY-18,'#8a5a32',1.6); h.poly([[hx+1,shY-20],[hx+7,shY-16],[hx+1,shY-9]],'#d8e8f0'); h.poly([[hx-2,shY-18],[hx+4,shY-18],[hx+1,shY-23]],'#d8e8f0'); break;
    case 'hoe': h.limb(hx+1,1,hx+1,shY-8,'#8a5a32',1.6); h.rect(hx-4,shY-9,7,2.5,'#8a8a96'); break;
    case 'flag': case 'banner': h.limb(hx+1,1,hx+1,shY-20,'#8a5a32',1.5); h.poly([[hx+1,shY-20],[hx+10,shY-18],[hx+1,shY-9]],pick(['#e04a3a','#f0b830','#3a6ad8'])); h.rect(hx+3,shY-17,3,3,'#ffd050',0); break;
    case 'lantern': h.limb(hx+1,hy-2,hx+1,shY-8,'#8a5a32',1.5); h.line(hx+1,shY-8,hx+7,shY-8,'#8a5a32',1.5); h.ellipse(hx+7,shY-3,3,4,'#e0382c'); h.line(hx+7,shY+1,hx+7,shY+4,'#ffd050',1); break;
    case 'parasol': h.limb(hx+1,hy-1,hx+1,topY-8,'#8a5a32',1.5); h.shape(pick(['#e04a3a','#f0a8a8','#f0b830','#5ac0a0','#fff4d8']),()=>{ctx.moveTo(-14,topY-7);ctx.quadraticCurveTo(0,topY-20,14,topY-7);}); ctx.strokeStyle=OUT; ctx.lineWidth=0.8; for(let x=-10;x<=10;x+=5){ctx.beginPath();ctx.moveTo(0,topY-14);ctx.lineTo(x,topY-8);ctx.stroke();} break;
    case 'fan': h.shape('#fff4d8',()=>{ctx.moveTo(hx,hy);ctx.arc(hx,hy,6,-PI*0.95,-PI*0.05);}); ctx.strokeStyle='#a0603a'; ctx.lineWidth=0.8; for(let a=-PI*0.8;a<0;a+=PI*0.2){ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+Math.cos(a)*5.5,hy+Math.sin(a)*5.5);ctx.stroke();} break;
    case 'basket': h.poly([[hx-4,hy-1],[hx+4,hy-1],[hx+3,hy+4.5],[hx-3,hy+4.5]],'#d8b078'); h.line(hx-3,hy+1.5,hx+3,hy+1.5,'#a0603a',1); ctx.beginPath(); ctx.arc(hx,hy-1,3.2,PI,TAU); h.outline(1.2); ctx.stroke(); h.dot(hx-1.5,hy-1.5,1.1,'#e04a3a'); h.dot(hx+1.5,hy-1.7,1.1,'#7ac050'); break;
    case 'bucket': h.poly([[hx-3.4,hy],[hx+3.4,hy],[hx+2.6,hy+5.5],[hx-2.6,hy+5.5]],'#8a5a32'); ctx.beginPath(); ctx.arc(hx,hy,3,PI,TAU); h.outline(1); ctx.stroke(); break;
    case 'bao': h.rect(hx-4,hy+1,8,2,'#8a5a32'); h.dot(hx-2,hy,1.6,'#fff4d8'); h.dot(hx+2,hy,1.6,'#fff4d8'); h.dot(hx,hy-2,1.6,'#fff4d8'); break;
    case 'jug': h.poly([[hx-2,hy-2],[hx+2,hy-2],[hx+3,hy+4],[hx-3,hy+4]],'#8a5a32'); break;
    case 'teapot': h.ellipse(hx,hy+1,3.4,2.6,'#8a5a32'); h.line(hx+3,hy,hx+6,hy-3,'#8a5a32',1.6); h.dot(hx,hy-2,1,'#8a5a32'); break;
    case 'bowl': h.arcShape(hx,hy-1,3.5,0,PI,'#a8d0e8'); break;
    case 'beads': ctx.strokeStyle='#8a5a32'; ctx.lineWidth=1.5; ctx.setLineDash([1,1]); ctx.beginPath(); ctx.ellipse(0,shY+5,4.5,6,0,0,TAU); ctx.stroke(); ctx.setLineDash([]); break;
    case 'fish': h.ellipse(hx+1,hy+1,3.8,1.6,'#a8d0e8'); h.poly([[hx+4.5,hy+1],[hx+6.5,hy-1],[hx+6.5,hy+3]],'#a8d0e8'); break;
    case 'scroll': h.rect(hx-1.5,hy-3,3,7,'#fff4d8',0); h.line(hx-1.5,hy-3,hx+1.5,hy-3,'#8a5a32',1); h.line(hx-1.5,hy+4,hx+1.5,hy+4,'#8a5a32',1); break;
    case 'drum': h.ellipse(hx,hy+1,4,3,'#e04a3a'); h.line(hx-4,hy+1,hx+4,hy+1,'#ffd050',1); break;
    case 'kite': h.line(hx,hy,hx+8,topY-10,'#8a8a96',0.8); h.poly([[hx+8,topY-16],[hx+13,topY-10],[hx+8,topY-4],[hx+3,topY-10]],pick(['#e04a3a','#f0b830','#2aa0a0'])); break;
  }
  ctx.restore();
}

// ---- animals
function drawDog(ctx,a,f){ const h=mk(ctx); const L=[1,-1,1,-1][f]; const c=a.color;
  h.limb(-5,-4,-5+L*2,-1,c,2.4); h.limb(4,-4,4-L*2,-1,c,2.4);
  h.ellipse(0,-6,7,3.5,c); h.limb(-2.5,-4,-2.5-L*2,-1,c,2.4); h.limb(6,-4,6+L*2,-1,c,2.4);
  if (a.stripes){ h.limb(-7,-7,-11,-12,'#fff4d8',2.2); for(let i=0;i<4;i++){const t=i/3.5; h.px(-7-4*t,-7-5*t,'#e04a3a');} }
  else h.limb(-7,-7,-11,-11,c,1.8);
  h.circle(7.5,-9,3.2,c); h.poly([[5.5,-11.5],[6.5,-15],[8.5,-11.5]],darken(c,0.7)); h.ellipse(10,-8,2,1.4,darken(c,0.8)); h.px(8,-10,OUT); h.px(11,-8.5,OUT);
}
function drawPig(ctx,a,f){ const h=mk(ctx); const L=[1,-1,1,-1][f]; const c='#f0a8a8';
  h.limb(-4.5,-4,-4.5+L*1.5,-1,c,2.6); h.limb(3.5,-4,3.5-L*1.5,-1,c,2.6);
  h.ellipse(0,-6,7.5,4.5,c); h.limb(-2,-4,-2-L*1.5,-1,c,2.6); h.limb(5.5,-4,5.5+L*1.5,-1,c,2.6);
  h.circle(7,-7.5,3.4,c); h.poly([[5,-10.5],[6,-13],[7.8,-10.5]],c); h.ellipse(9.8,-7,2,1.5,'#f08ab0'); h.px(9,-7,OUT); h.px(10.5,-7,OUT); h.px(7.5,-9,OUT);
}
function drawChicken(ctx,a,f){ const h=mk(ctx); const L=[1,-1,1,-1][f]; const c=a.color;
  h.line(-1.2,-3,-1.2+L*1.2,0,'#f07a2a',1); h.line(1.2,-3,1.2-L*1.2,0,'#f07a2a',1);
  h.ellipse(0,-4.5,4,2.8,c); h.poly([[-3.5,-5.5],[-6.5,-8],[-3,-7]],darken(c,0.8));
  h.circle(3.6,-8,1.9,c); h.poly([[3,-10],[4,-11.5],[5,-10]],'#e04a3a'); h.poly([[5.3,-8],[7.2,-7.4],[5.3,-6.9]],'#f07a2a'); h.px(4,-8.5,OUT);
}
function drawCrane(ctx,f){ const h=mk(ctx); const L=[1,-1,1,-1][f];
  h.line(-1,-12,-1+L,-1,'#3a3440',1); h.line(1,-12,1-L,-1,'#3a3440',1); h.ellipse(0,-14,6,3.5,'#fff4d8'); h.poly([[-6,-14],[-10,-11],[-5,-12]],'#3a3440');
  h.line(5,-16,7,-26,'#fff4d8',2); h.circle(7,-27,2,'#fff4d8'); h.px(6,-29,'#e04a3a'); h.line(9,-27,13,-26,'#3a3440',1.2); }
function drawBird(ctx,f){ ctx.strokeStyle=OUT; ctx.lineWidth=1.2; ctx.lineCap='round'; ctx.beginPath();

// ------------------------------------------------------------------ SIMULATION
function step(e,dt){
  if (e.pause>0){ e.pause-=dt; if (e.idle && chance(0.004)) e.flip=!e.flip; return; }
  const dx=e.tx-e.x, dy=e.ty-e.y, dist=Math.hypot(dx,dy);
  if (dist<2){
    if (e.mode==='street'){ const nb=neighbors(...e.node).filter(n=>!(n[0]===e.prev[0]&&n[1]===e.prev[1])); const next=nb.length?pick(nb):e.prev; e.prev=e.node; e.node=next; const [nx,ny]=nodePos(...next); e.tx=nx+rnd(-32,32); e.ty=ny+rnd(-32,32); }
    else if (e.mode==='plaza') pickPlaza(e); else if (e.mode==='yard') pickYard(e); else pickField(e);
    if (chance(e.pauseChance)) e.pause=rnd(0.8,5);
    return;
  }
  const v=e.speed*dt; const k=Math.min(1,v/dist); e.x+=dx*k; e.y+=dy*k;
  if (Math.abs(dx)>0.5) e.flip=dx<0;
  if (e.mode==='plaza'){ const fx=e.x-CENTER.x, fy=e.y-CENTER.y, fd=Math.hypot(fx,fy); if (fd<50){ e.x=CENTER.x+fx/fd*50; e.y=CENTER.y+fy/fd*50; } }
}
const clock=new THREE.Clock(); let t=0, frames=0, fpsT=0;
const stats=document.getElementById('stats');
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,clock.getDelta()); t+=dt;
  for(let i=0;i<people.length;i++){ const e=people[i];
    step(e,dt);
    const f=e.pause>0?e.standFrame:Math.floor(t*e.fps+e.phase)%4;
    const r=e.rec; r.x=e.x; r.y=e.y; r.z=zOf(e.y); r.d=e.frames[f]; r.flip=e.flip; dyn.update(r);
    shadows.set(i,Math.round(e.x),Math.round(e.y),e.shR[0],e.shR[1]);
  }
  for(const b of birds){ b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.x<-20) b.x=W+20; if(b.x>W+20) b.x=-20; if(b.y<0||b.y>H) b.vy=-b.vy; const r=b.rec; r.x=b.x; r.y=b.y; r.d=birdFrames[Math.floor(t*6+b.phase)%2]; r.flip=b.vx<0; dyn.update(r); }
  for(const k in specials){ const s=specials[k]; if(s.ring){ s.ring.x=s.e.x; s.ring.y=s.e.y+(s.e.kind==='dog'?-14:0); dyn.update(s.ring); } }
  dyn.commit(); shadows.commit();
  renderer.render(scene,camera);
  frames++; fpsT+=dt; if (fpsT>0.5){ stats.textContent=`${Math.round(frames/fpsT)} fps · ${people.length} characters · zoom ${zoom.toFixed(2)}`; frames=0; fpsT=0; }
}
document.getElementById('loading').remove();
animate();
</script>
</body>
</html>
